name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-local:
    name: Windows local MCP (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.13'
            experimental: false
          # Track upstream wheel support without claiming 3.15 is supported yet.
          - python-version: '3.15'
            experimental: true
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-suffix: windows-${{ matrix.python-version }}

      - name: Report interpreter and installer
        run: |
          python --version
          uv --version

      - name: Install dependencies with native wheels
        run: uv sync --locked --all-extras --verbose --no-build-package duckdb --no-build-package pyyaml --no-build-package pydantic-core

      - name: Check CLI startup
        run: uv run --no-sync mcp-server-motherduck --help

      - name: Test local MCP communication, queries, and database switching
        run: uv run --no-sync pytest tests/e2e/test_memory_duckdb.py tests/e2e/test_switch_database_connection.py tests/e2e/test_protocol_discover.py -v

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Only run on main branch pushes or manual trigger to avoid using secrets on untrusted PRs
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      
      - name: Install dependencies
        run: uv sync --all-extras
      
      - name: Create test database
        env:
          MOTHERDUCK_TOKEN_READ_SCALING: ${{ secrets.MOTHERDUCK_TOKEN_READ_SCALING }}
        run: uv run python tests/e2e/fixtures/create_test_db.py
      
      - name: Run E2E tests
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_TOKEN_READ_SCALING: ${{ secrets.MOTHERDUCK_TOKEN_READ_SCALING }}
          S3_TEST_DB_PATH: s3://md-test-bucket-user-1/test-mcp/test.duckdb
          AWS_ACCESS_KEY_ID: ${{ secrets.E2E_USER_1_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_USER_1_AWS_SECRET_ACCESS_KEY }}
        run: |
          uv run pytest tests/e2e/ -v -m "not slow"
